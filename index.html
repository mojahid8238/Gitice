<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Git Visual Simulator</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-main">
                <h1>gitice</h1>
            </div>
            <div class="header-actions">
                <label for="project-select">Scenario:</label>
                <select id="project-select">
                    <option value="simple">Simple (Linear)</option>
                    <option value="intermediate">Intermediate (Branching)</option>
                    <option value="complex">Complex (Collaborative)</option>
                    <option value="advanced">Advanced (Enterprise)</option>
                </select>
            </div>
        </header>

        <main class="main-content" id="main-content">
            <div class="visualization-panel" id="visual-panel">
                <div class="canvas-container" id="canvas-container">
                    <svg id="git-graph-svg" class="git-graph-svg"></svg>
                    <div id="nodes-container" class="nodes-container"></div>
                </div>
            </div>

            <div class="resizer" id="resizer"></div>

            <div class="terminal-panel" id="terminal-panel">
                <div class="terminal-header">
                    <div class="terminal-dots">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                    </div>
                    <div class="terminal-title">bash - mojahid@gitice:~</div>
                    <div class="terminal-actions">
                        <button id="toggle-layout" title="Toggle Layout (V/H)">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path
                                    d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM7 10h10v2H7z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="terminal-body" id="terminal-body">
                    <div class="terminal-output" id="terminal-output"></div>
                    <div class="terminal-input-line">
                        <span class="prompt" id="terminal-prompt"></span>
                        <input type="text" id="terminal-input" autocomplete="off" spellcheck="false" autofocus>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="toast" class="toast">Hash copied!</div>
    <script src="script.js"></script>
</body>

</html>
